<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dual Browser Preview - Torcida Redesign</title>
  <style>
    body { margin: 0; padding: 0; display: flex; height: 100vh; background: #0d1245; color: white; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
    .container { display: flex; width: 100%; height: 100%; gap: 16px; padding: 16px; box-sizing: border-box; }
    .panel { display: flex; flex-direction: column; align-items: center; height: 100%; }
    .desktop-panel { flex: 1; min-width: 0; }
    .mobile-panel { width: 400px; flex-shrink: 0; }
    iframe { width: 100%; height: calc(100% - 36px); border: 2px solid rgba(253, 224, 47, 0.3); border-radius: 12px; background: #0d1245; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .title { margin-bottom: 10px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #FDE02F; display: flex; items-center; gap: 8px; }
    .mobile-frame { width: 390px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel desktop-panel">
      <div class="title">🖥️ Desktop (1440 x 900)</div>
      <iframe src="./index.html"></iframe>
    </div>
    <div class="panel mobile-panel">
      <div class="title">📱 Mobile (390 x 844)</div>
      <iframe src="./index.html" class="mobile-frame"></iframe>
    </div>
  </div>
</body>
</html>
